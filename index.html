<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tarot</title>
<!-- ขอไม่ให้นำรูป/เนื้อหาไปใช้เทรน AI หรือทำ dataset -->
<meta name="robots" content="noai, noimageai">
<meta name="tdm-reservation" content="1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="sky"></canvas>
<header><h1 id="title"></h1><p id="sub"></p></header>

<main id="stage"><div id="ring"></div></main>

<footer>
  <p id="hint"></p>
  <button id="again" hidden>คลี่ไพ่ใหม่</button>

</footer>

<section id="viewer" hidden>
  <canvas class="vfx" id="vfxBack"></canvas>
  <div id="auraBox"><i class="pa"></i><i class="pa pa2"></i></div>
  <canvas class="vfx" id="vfxFront"></canvas>
  <button class="x" id="close" aria-label="ปิด">&times;</button>
  <button class="nav prev" id="prev" aria-label="ใบก่อนหน้า">&lsaquo;</button>
  <button class="nav next" id="next" aria-label="ใบถัดไป">&rsaquo;</button>
  <div class="slide" id="slide">
    <div class="pw" id="pw">
      <figure class="pic wm" id="pic">
        <img id="img" alt="" hidden decoding="async" fetchpriority="high">
        <img class="promo" id="promoImg" alt="" hidden aria-hidden="true">
        <div id="ph"></div>
      </figure>
    </div>
    <article class="info">
      <p class="no" id="no"></p>
      <h2 id="nm"></h2>
      <p class="th" id="th"></p>
      <dl>
        <dt id="lblDs">นักออกแบบ</dt><dd id="ds"></dd>
        <dt id="lblMn">ความหมาย</dt><dd id="mn"></dd>
      </dl>
      <button class="more" id="more" type="button" aria-expanded="false" aria-controls="detail">อ่านเพิ่มเติม</button>
      <div class="detail" id="detail" hidden></div>
      <a class="shop" target="_blank" rel="noopener"></a>
      <p class="notice" id="notice"></p>
    </article>
  </div>
</section>

<div id="lightbox" hidden><div class="wm" id="lbWrap"><img id="lbImg" alt=""><img class="promo" id="lbPromo" alt="" hidden aria-hidden="true"></div></div>

<script src="js/config.js"></script>
<script src="js/sound.js"></script>
<script src="js/app.js"></script>
</body>
</html>
